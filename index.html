<!doctype html>
<html lang="zh-CN" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ORBIT · 工业级 QQ 协议端控制台，内置 OneBot 11 兼容内核、心跳守望与风险防护。" />
    <meta name="theme-color" content="#ffffff" />
    <title>ORBIT · QQ 协议端</title>
    <style>
      /* Critical boot paint — inlined so the splash renders before any bundle is parsed. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #09090b;
        color: #fafafa;
        font-family: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        transition: opacity 260ms ease, visibility 260ms ease;
      }
      #boot[data-leaving="true"] {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #boot .boot-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(250, 250, 250, 0.045) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(250, 250, 250, 0.045) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: radial-gradient(circle at 50% 48%, #000 0%, transparent 68%);
      }
      #boot .boot-core {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        padding: 24px;
        width: min(320px, 82vw);
      }
      #boot .boot-mark {
        position: relative;
        width: 74px;
        height: 74px;
      }
      #boot .boot-mark svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #boot .boot-halo {
        position: absolute;
        inset: -18px;
        border-radius: 50%;
        border: 1px solid rgba(250, 250, 250, 0.1);
        animation: boot-pulse 2.4s ease-in-out infinite;
      }
      #boot .boot-halo:nth-of-type(2) {
        inset: -34px;
        animation-delay: 0.6s;
        border-color: rgba(250, 250, 250, 0.06);
      }
      #boot .boot-name {
        display: flex;
        align-items: baseline;
        gap: 8px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      #boot .boot-name span {
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.22em;
        color: #71717a;
      }
      #boot .boot-bar {
        position: relative;
        width: 100%;
        height: 2px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(250, 250, 250, 0.1);
      }
      #boot .boot-bar i {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0%;
        border-radius: 999px;
        background: linear-gradient(90deg, #a1a1aa, #fafafa);
        transition: width 220ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      #boot .boot-meta {
        display: flex;
        width: 100%;
        justify-content: space-between;
        font-family: "JetBrains Mono", ui-monospace, Consolas, monospace;
        font-size: 9.5px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #52525b;
      }
      #boot .boot-status {
        color: #a1a1aa;
        transition: opacity 160ms ease;
      }
      @keyframes boot-pulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.06); opacity: 0.4; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-halo { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div class="boot-grid" aria-hidden="true"></div>
      <div class="boot-core">
        <div class="boot-mark" aria-hidden="true">
          <span class="boot-halo"></span>
          <span class="boot-halo"></span>
          <svg viewBox="0 0 64 64" fill="none">
            <rect x="3" y="3" width="58" height="58" rx="16" stroke="#fafafa" stroke-opacity="0.85" />
            <ellipse cx="32" cy="32" rx="21" ry="10.4" transform="rotate(-32 32 32)" stroke="#fafafa" stroke-opacity="0.45" />
            <ellipse cx="32" cy="32" rx="13" ry="6.4" transform="rotate(28 32 32)" stroke="#fafafa" stroke-opacity="0.22" />
            <circle cx="47.2" cy="19.2" r="4.8" fill="#fafafa" />
            <circle cx="32" cy="32" r="2.6" fill="#fafafa" fill-opacity="0.45" />
          </svg>
        </div>
        <div class="boot-name">星轨 · ORBIT <span>0.0.1-beta</span></div>
        <div class="boot-bar"><i id="boot-progress"></i></div>
        <div class="boot-meta">
          <span id="boot-status" class="boot-status">正在唤醒协议内核</span>
          <span id="boot-percent">0%</span>
        </div>
      </div>
    </div>
    <noscript>星轨 · ORBIT 需要启用 JavaScript 才能运行。</noscript>
    <script>
      window.__orbitBoot = (function () {
        var root = document.getElementById('boot')
        var bar = document.getElementById('boot-progress')
        var pct = document.getElementById('boot-percent')
        var status = document.getElementById('boot-status')
        var current = 0
        function set(value, text) {
          current = Math.max(current, Math.min(100, value))
          if (bar) bar.style.width = current + '%'
          if (pct) pct.textContent = current + '%'
          if (text && status) status.textContent = text
        }
        function done() {
          set(100, '就绪')
          if (!root) return
          root.dataset.leaving = 'true'
          setTimeout(function () {
            if (root && root.parentNode) root.parentNode.removeChild(root)
          }, 320)
        }
        return { set: set, done: done }
      })()
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
